name: sirfbill_restraunt_backend

services:
  # --------------------------------------------------------
  # 1. PostgreSQL Database Service
  # --------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: sirfbill_restraunt_backend_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sirfbill_restraunt}
    volumes:
      - sirfbill_restraunt_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sirfbill_restraunt}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - sirfbill_restraunt_network

  # --------------------------------------------------------
  # 2. pgAdmin 4 Database Management Console (Port 8034)
  # --------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sirfbill_restraunt_backend_pgadmin
    restart: always
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sirfbill.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
      PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT: "False"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
    ports:
      - "8034:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sirfbill_restraunt_pgadmin_data:/var/lib/pgadmin
    networks:
      - sirfbill_restraunt_network

  # --------------------------------------------------------
  # 3. SirfBill FastAPI Restaurant Backend (Port 8033)
  # --------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sirfbill_restraunt_backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PORT: 8033
    ports:
      - "8033:8033"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
    networks:
      - sirfbill_restraunt_network

# --------------------------------------------------------
# Persistent Storage Volumes
# --------------------------------------------------------
volumes:
  sirfbill_restraunt_db_data:
    driver: local
  sirfbill_restraunt_pgadmin_data:
    driver: local

# --------------------------------------------------------
# Isolated Bridge Network
# --------------------------------------------------------
networks:
  sirfbill_restraunt_network:
    driver: bridge
